<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - ZeeFast</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .orders-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            padding: 24px;
            margin-bottom: 16px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-restaurant {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .order-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.delivered {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-badge.confirmed {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-badge.cancelled {
            background: #ffebee;
            color: #c62828;
        }

        .order-items {
            margin-bottom: 16px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.9375rem;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-weight: 700;
        }

        .order-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .orders-page {
                padding: 24px 16px;
            }

            .order-card {
                padding: 16px;
                border-radius: 12px;
            }

            .order-header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .order-actions {
                flex-direction: column;
                width: 100%;
            }

            .order-actions .btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .order-restaurant {
                font-size: 1rem;
            }

            .order-item {
                font-size: 0.875rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🍕<span>Zee<span style="color:black">Fast</span></span></a>
            <div class="navbar-nav">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
                <a href="profile.html" class="nav-link"><i class="fas fa-user"></i><span>Profile</span></a>
                <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span class="badge cart-badge"
                        style="display:none">0</span></a>
            </div>
        </div>
    </nav>

    <main class="page-wrapper">
        <div class="orders-page">
            <h1 style="margin-bottom:24px;">Your Orders</h1>
            <div id="orders"></div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadOrders() {
            if (!AuthModule.isLoggedIn()) { location.href = '/login.html'; return; }

            const container = document.getElementById('orders');
            showSkeleton(container, 3, 'card');

            try {
                const response = await API.Orders.getAll();
                const orders = response.data;

                if (!orders.length) {
                    showEmpty(container, 'receipt', 'No orders yet', 'Start ordering to see your history here');
                    return;
                }

                container.innerHTML = orders.map(order => `
                    <div class="order-card reveal">
                        <div class="order-header">
                            <div>
                                <div class="order-restaurant">${order.restaurantName}</div>
                                <div class="order-date">${formatDate(order.orderedAt)} ${order.paymentMethod ? '• ' + order.paymentMethod : ''}</div>
                            </div>
                            <span class="status-badge ${order.status}">${order.status}</span>
                        </div>
                        
                        <div class="order-items">
                            ${order.items.map(i => `
                                <div class="order-item">
                                    <span>${i.name} × ${i.quantity}</span>
                                    <span>₹${i.price * i.quantity}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="order-total">
                            <span>Total</span>
                            <span>₹${order.total}</span>
                        </div>
                        
                        <div class="order-actions">
                            ${order.status === 'delivered' ? `<button class="btn btn-primary btn-sm" onclick="reorder('${order.id}')"><i class="fas fa-redo"></i> Reorder</button>` : ''}
                            <a href="menu.html?id=${order.restaurantId}" class="btn btn-secondary btn-sm">View Restaurant</a>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                showError(container, 'Failed to load orders');
            }
        }

        async function reorder(orderId) {
            try {
                const response = await API.Orders.reorder(orderId);
                showToast(`${response.data.addedItems} items added to cart!`, 'success');
                location.href = '/cart.html';
            } catch (e) {
                showToast(e.message || 'Reorder failed', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>

</html>
