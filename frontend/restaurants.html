<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - ZeeFast</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 100%);
            min-height: 100vh;
        }

        /* ===== Hero Section ===== */
        .hero-section {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 120px 20px 80px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(252, 128, 25, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 5s ease-in-out infinite reverse;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(252, 128, 25, 0.2);
            border: 1px solid rgba(252, 128, 25, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            color: #fc8019;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            line-height: 1.2;
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        .hero-title span {
            background: linear-gradient(135deg, #fc8019, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 40px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Search Bar ===== */
        .search-wrapper {
            max-width: 700px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        .search-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(252, 128, 25, 0.5);
            box-shadow: 0 20px 60px rgba(252, 128, 25, 0.2);
        }

        .search-bar input {
            flex: 1;
            border: none;
            padding: 22px 30px;
            font-size: 1rem;
            background: transparent;
            color: white;
            outline: none;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar button {
            background: linear-gradient(135deg, #fc8019, #ff6b35);
            color: white;
            border: none;
            padding: 22px 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .search-bar button:hover {
            background: linear-gradient(135deg, #ff6b35, #fc8019);
            transform: scale(1.02);
        }

        /* ===== Stats Row ===== */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
            animation: fadeInUp 0.6s ease 0.4s both;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #fc8019;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* ===== Filters Section ===== */
        .filters-section {
            max-width: 1200px;
            margin: -30px auto 30px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .filters-card {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .filter-chips {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            padding: 12px 24px;
            border-radius: 50px;
            background: #f8f9fa;
            border: 2px solid transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .chip.active {
            background: linear-gradient(135deg, #fc8019, #ff6b35);
            color: white;
            box-shadow: 0 8px 25px rgba(252, 128, 25, 0.4);
            transform: translateY(-2px);
        }

        .chip i {
            font-size: 0.9rem;
        }

        /* ===== Restaurants Section ===== */
        .restaurants-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fc8019, #ff6b35);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 8px 25px rgba(252, 128, 25, 0.3);
        }

        .section-header h2 {
            font-size: 1.5rem;
            color: #1a1a2e;
            font-family: 'Outfit', sans-serif;
        }

        .section-header h2 span {
            color: #888;
            font-weight: 400;
            font-size: 1rem;
            margin-left: 10px;
        }

        .sort-select {
            padding: 12px 20px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-weight: 500;
            cursor: pointer;
            background: white;
            transition: all 0.3s ease;
        }

        .sort-select:focus {
            border-color: #fc8019;
            outline: none;
        }

        /* ===== Restaurant Grid ===== */
        .restaurants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* ===== Restaurant Card - Premium Design ===== */
        .restaurant-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* .restaurant-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fc8019, #ff6b35, #fc8019);
            opacity: 0;
            transition: opacity 0.3s ease;
        } */

        .restaurant-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
        }

        .restaurant-card:hover::before {
            opacity: 1;
        }

        .card-image {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .restaurant-card:hover .card-image img {
            transform: scale(1.12);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(0, 0, 0, 0.8));
        }

        /* Badges */
        .card-badges {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .badge.veg {
            background: rgba(39, 174, 96, 0.9);
            color: white;
        }

        .badge.offer {
            background: rgba(252, 128, 25, 0.95);
            color: white;
        }

        /* Rating */
        .card-rating {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
            z-index: 2;
        }

        .card-rating i {
            font-size: 0.75rem;
        }

        /* Time & Delivery */
        .card-info-strip {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 2;
        }

        .info-chip {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1a1a2e;
        }

        .info-chip i {
            color: #fc8019;
            font-size: 0.75rem;
        }

        /* Card Content */
        .card-content {
            padding: 22px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a1a2e;
            font-family: 'Outfit', sans-serif;
            transition: color 0.3s ease;
        }

        .restaurant-card:hover .card-title {
            color: #fc8019;
        }

        .favorite-btn {
            width: 38px;
            height: 38px;
            background: #f8f9fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ccc;
        }

        .favorite-btn:hover {
            background: #ffe8dc;
            color: #e74c3c;
            transform: scale(1.1);
        }

        .favorite-btn.active {
            color: #e74c3c;
            background: #ffe8dc;
        }

        .card-cuisine {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-cuisine i {
            color: #fc8019;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .offer-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff5eb, #ffe8dc);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fc8019;
        }

        .offer-tag i {
            font-size: 0.9rem;
        }

        .view-menu-btn {
            background: linear-gradient(135deg, #1a1a2e, #2d2d4a);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-menu-btn:hover {
            background: linear-gradient(135deg, #fc8019, #ff6b35);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(252, 128, 25, 0.4);
        }

        .view-menu-btn i {
            transition: transform 0.3s ease;
        }

        .restaurant-card:hover .view-menu-btn i {
            transform: translateX(4px);
        }

        /* ===== Loading Skeleton ===== */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 24px;
            height: 380px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* ===== Empty State ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #888;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .hero-section {
                padding: 100px 20px 60px;
            }

            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .search-bar {
                flex-direction: column;
                border-radius: 20px;
            }

            .search-bar input {
                padding: 18px 20px;
            }

            .search-bar button {
                justify-content: center;
                border-radius: 0 0 20px 20px;
            }

            .stats-row {
                gap: 30px;
                flex-wrap: wrap;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .filters-card {
                padding: 15px 20px;
            }

            .filter-chips {
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 5px;
            }

            .chip {
                flex-shrink: 0;
                padding: 10px 18px;
                font-size: 0.85rem;
            }

            .restaurants-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .card-footer {
                flex-direction: column;
                gap: 12px;
            }

            .offer-tag,
            .view-menu-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">🍕<span style="color:#fc8019">Zee</span><span
                    style="color:#1a1a2e">Fast</span></a>
            <div class="navbar-nav">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
                <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i><span>Cart</span><span
                        class="badge cart-badge" style="display:none">0</span></a>
                <a href="login.html" class="nav-link auth-link"><i class="fas fa-user"></i><span>Login</span></a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-badge">
                <i class="fas fa-fire"></i>
                Trending in your city
            </div>
            <h1 class="hero-title">Discover <span>Delicious</span> Food</h1>
            <p class="hero-subtitle">Explore the best restaurants and cuisines near you. Order your favorites with just
                a few clicks!</p>

            <div class="search-wrapper">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="Search restaurants, cuisines, or dishes...">
                    <button onclick="searchRestaurants()"><i class="fas fa-search"></i> Search</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number">500+</div>
                    <div class="stat-label">Restaurants</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">50k+</div>
                    <div class="stat-label">Happy Customers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100+</div>
                    <div class="stat-label">Cuisines</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section class="filters-section">
        <div class="filters-card">
            <div class="filter-chips">
                <div class="chip active" data-filter="all"><i class="fas fa-th-large"></i> All</div>
                <div class="chip" data-filter="rating"><i class="fas fa-star"></i> 4.0+ Rating</div>
                <div class="chip" data-filter="fast"><i class="fas fa-bolt"></i> Fast Delivery</div>
                <div class="chip" data-filter="veg"><i class="fas fa-leaf"></i> Pure Veg</div>
                <div class="chip" data-filter="offers"><i class="fas fa-percent"></i> Great Offers</div>
            </div>
        </div>
    </section>

    <!-- Restaurants Grid -->
    <section class="restaurants-section">
        <div class="section-header">
            <div class="section-title-group">
                <div class="section-icon">
                    <i class="fas fa-utensils"></i>
                </div>
                <h2 id="results-title">All Restaurants <span id="count"></span></h2>
            </div>
            <select id="sort" class="sort-select">
                <option value="rating">Sort by Rating</option>
                <option value="time">Delivery Time</option>
                <option value="popularity">Popularity</option>
            </select>
        </div>
        <div class="restaurants-grid" id="restaurants"></div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentFilters = { rating: false, fast: false, veg: false, offers: false };

        function goToMenu(id) {
            window.location.href = 'menu.html?id=' + id;
        }

        function toggleFavorite(event, btn) {
            event.stopPropagation();
            btn.classList.toggle('active');
            const icon = btn.querySelector('i');
            icon.className = btn.classList.contains('active') ? 'fas fa-heart' : 'far fa-heart';
        }

        async function loadRestaurants() {
            const container = document.getElementById('restaurants');

            // Show loading
            container.innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');

            try {
                // Get restaurants from mock data directly
                let restaurants = MockData.getRestaurants();

                // Apply filters
                if (currentFilters.rating) {
                    restaurants = restaurants.filter(r => r.rating >= 4.0);
                }
                if (currentFilters.fast) {
                    restaurants = restaurants.filter(r => parseInt(r.deliveryTime) <= 30);
                }
                if (currentFilters.veg) {
                    restaurants = restaurants.filter(r => r.isPureVeg);
                }
                if (currentFilters.offers) {
                    restaurants = restaurants.filter(r => r.offers && r.offers.length > 0);
                }

                // Sort
                const sort = document.getElementById('sort').value;
                if (sort === 'rating') {
                    restaurants.sort((a, b) => b.rating - a.rating);
                }

                // Update count
                document.getElementById('count').textContent = `(${restaurants.length} found)`;

                if (restaurants.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-search"></i></div>
                            <h3>No restaurants found</h3>
                            <p>Try adjusting your filters or search for something else</p>
                        </div>`;
                    return;
                }

                container.innerHTML = restaurants.map(r => `
                    <div class="restaurant-card" onclick="goToMenu('${r.id}')">
                        <div class="card-image">
                            <img src="${r.image}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'">
                            <div class="card-overlay"></div>
                            
                            <div class="card-badges">
                                ${r.isPureVeg ? '<span class="badge veg"><i class="fas fa-leaf"></i> Pure Veg</span>' : ''}
                            </div>
                            
                            <div class="card-rating">
                                <i class="fas fa-star"></i> ${r.rating}
                            </div>
                            
                            <div class="card-info-strip">
                                <div class="info-chip">
                                    <i class="fas fa-clock"></i> ${r.deliveryTime}
                                </div>
                                <div class="info-chip">
                                    <i class="fas fa-motorcycle"></i> ₹${r.deliveryFee}
                                </div>
                            </div>
                        </div>
                        
                        <div class="card-content">
                            <div class="card-header">
                                <h3 class="card-title">${r.name}</h3>
                                <div class="favorite-btn" onclick="toggleFavorite(event, this)">
                                    <i class="far fa-heart"></i>
                                </div>
                            </div>
                            
                            <p class="card-cuisine">
                                <i class="fas fa-utensils"></i>
                                ${r.cuisine.slice(0, 3).join(' • ')}
                            </p>
                            
                            <div class="card-footer">
                                ${r.offers?.[0] ? `
                                    <div class="offer-tag">
                                        <i class="fas fa-tag"></i>
                                        ${r.offers[0].length > 25 ? r.offers[0].substring(0, 25) + '...' : r.offers[0]}
                                    </div>
                                ` : '<div></div>'}
                                <button class="view-menu-btn" onclick="event.stopPropagation(); goToMenu('${r.id}')">
                                    View Menu <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="empty-state"><h3>Failed to load restaurants</h3><p>Please try again later</p></div>';
            }
        }

        function searchRestaurants() {
            const query = document.getElementById('search').value.toLowerCase();
            if (query) {
                const results = MockData.searchRestaurants(query);
                document.getElementById('results-title').innerHTML = `Results for "${query}" <span>(${results.length} found)</span>`;
                renderRestaurants(results);
            } else {
                document.getElementById('results-title').innerHTML = 'All Restaurants <span id="count"></span>';
                loadRestaurants();
            }
        }

        function renderRestaurants(restaurants) {
            const container = document.getElementById('restaurants');
            document.getElementById('count').textContent = `(${restaurants.length} found)`;

            if (restaurants.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-search"></i></div>
                        <h3>No results found</h3>
                        <p>Try searching for something else</p>
                    </div>`;
                return;
            }

            container.innerHTML = restaurants.map(r => `
                <div class="restaurant-card" onclick="goToMenu('${r.id}')">
                    <div class="card-image">
                        <img src="${r.image}" alt="${r.name}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'">
                        <div class="card-overlay"></div>
                        
                        <div class="card-badges">
                            ${r.isPureVeg ? '<span class="badge veg"><i class="fas fa-leaf"></i> Pure Veg</span>' : ''}
                        </div>
                        
                        <div class="card-rating">
                            <i class="fas fa-star"></i> ${r.rating}
                        </div>
                        
                        <div class="card-info-strip">
                            <div class="info-chip">
                                <i class="fas fa-clock"></i> ${r.deliveryTime}
                            </div>
                            <div class="info-chip">
                                <i class="fas fa-motorcycle"></i> ₹${r.deliveryFee}
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-content">
                        <div class="card-header">
                            <h3 class="card-title">${r.name}</h3>
                            <div class="favorite-btn" onclick="toggleFavorite(event, this)">
                                <i class="far fa-heart"></i>
                            </div>
                        </div>
                        
                        <p class="card-cuisine">
                            <i class="fas fa-utensils"></i>
                            ${r.cuisine.slice(0, 3).join(' • ')}
                        </p>
                        
                        <div class="card-footer">
                            ${r.offers?.[0] ? `
                                <div class="offer-tag">
                                    <i class="fas fa-tag"></i>
                                    ${r.offers[0].length > 25 ? r.offers[0].substring(0, 25) + '...' : r.offers[0]}
                                </div>
                            ` : '<div></div>'}
                            <button class="view-menu-btn" onclick="event.stopPropagation(); goToMenu('${r.id}')">
                                View Menu <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Filter click handlers
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const filter = chip.dataset.filter;

                if (filter === 'all') {
                    currentFilters = { rating: false, fast: false, veg: false, offers: false };
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    document.getElementById('results-title').innerHTML = 'All Restaurants <span id="count"></span>';
                } else {
                    document.querySelector('[data-filter="all"]').classList.remove('active');
                    chip.classList.toggle('active');
                    currentFilters[filter] = chip.classList.contains('active');

                    // Update title based on active filters
                    const activeFilters = Object.entries(currentFilters).filter(([k, v]) => v).map(([k]) => k);
                    if (activeFilters.length > 0) {
                        document.getElementById('results-title').innerHTML = 'Filtered Results <span id="count"></span>';
                    } else {
                        document.querySelector('[data-filter="all"]').classList.add('active');
                        document.getElementById('results-title').innerHTML = 'All Restaurants <span id="count"></span>';
                    }
                }
                loadRestaurants();
            });
        });

        document.getElementById('sort').addEventListener('change', loadRestaurants);
        document.getElementById('search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchRestaurants();
        });

        document.addEventListener('DOMContentLoaded', loadRestaurants);
    </script>
</body>

</html>
